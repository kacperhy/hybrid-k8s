server {
    listen 8080;
    server_name _;

    # Dynamiczne rozwiązywanie nazwy usługi api (działa też, gdy api
    # wystartuje później niż frontend).
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;
    set $api_upstream http://api.hybrid-app.svc.cluster.local:8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Health check pełnego łańcucha frontend -> api -> redis
    # (to sprawdza Azure Traffic Manager).
    location = /healthz {
        proxy_pass $api_upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Lokalny liveness samego nginx.
    location = /livez {
        access_log off;
        return 200 "ok\n";
    }
}
