# CI: test -> build -> push do GHCR -> podbicie tagu w deploy/base.
# Argo CD w obu klastrach widzi nowy commit i wdraża TEN SAM obraz (tag = SHA).
name: build-and-release

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/api/requirements.txt pytest
      - run: cd app/api && pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')/hybrid-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Bump image tags
        run: |
          OWNER=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')
          cd deploy/base
          kustomize edit set image hybrid-api=ghcr.io/$OWNER/hybrid-api:${{ github.sha }}
          kustomize edit set image hybrid-frontend=ghcr.io/$OWNER/hybrid-frontend:${{ github.sha }}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: obrazy ${GITHUB_SHA::7}" || echo "brak zmian"
          git push
