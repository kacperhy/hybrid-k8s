# Traefik w AKS (w k3s Traefik jest wbudowany).
# Wariant VPN: WEWNĘTRZNY load balancer Azure – adres tylko w VNet (10.50.1.250),
# osiągalny z sieci VPN przez bramkę WireGuard. Brak publicznego IP.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.50.1.250" # = ingress_ip w Terraform
    # sonda Azure Load Balancera na port Traefika (TCP), żeby nie zależała od reguł Ingress
    service.beta.kubernetes.io/port_80_health-probe_protocol: Tcp
    service.beta.kubernetes.io/port_443_health-probe_protocol: Tcp
  spec:
    externalTrafficPolicy: Cluster
ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443
resources:
  requests: { cpu: 50m, memory: 64Mi }
