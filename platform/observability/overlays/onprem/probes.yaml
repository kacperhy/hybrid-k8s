apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: peer-cluster
spec:
  jobName: peer-cluster
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels: { probe_type: peer }
      static:
        - http://10.50.1.250/healthz
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: global-endpoint
spec:
  jobName: global-endpoint
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels: { probe_type: global }
      static:
        - http://10.10.20.1:8080/healthz
