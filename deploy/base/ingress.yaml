# Ingress bez reguły host = łapie każdy Host header. Dzięki temu działa:
#  - ruch użytkowników na app.<domena> (CNAME do Traffic Managera),
#  - sondy Traffic Managera kierowane bezpośrednio na endpointy,
#  - testy po IP / nazwie konkretnego klastra.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
