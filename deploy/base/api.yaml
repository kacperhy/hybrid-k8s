apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Bez tego K8s wstrzykuje zmienne usług, m.in. REDIS_PORT=tcp://10.43.x.x:6379,
      # które nadpisują naszą konfigurację i psują int(REDIS_PORT) w aplikacji.
      enableServiceLinks: false
      containers:
        - name: api
          image: hybrid-api
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef: { name: cluster-info }
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
