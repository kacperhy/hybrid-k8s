# HAProxy na Raspberry Pi – jedyny punkt wejścia do aplikacji (tylko z sieci VPN).
#   http://10.10.20.1/        -> klaster onprem (k3s), a gdy padnie -> AKS
#   http://10.10.20.1:8404/   -> panel statystyk HAProxy (stan backendów na żywo)
global
    log /dev/log local0
    maxconn 512

defaults
    mode http
    log global
    option httplog
    option redispatch          # gdy serwer padnie w trakcie, ponów na innym
    retries 2
    timeout connect 2s
    timeout client  30s
    timeout server  30s

frontend app
    bind 10.10.20.1:80
    default_backend clusters

backend clusters
    # /healthz sprawdza cały łańcuch frontend -> api -> redis
    option httpchk GET /healthz
    http-check expect status 200
    # sprawdzanie co 2 s; 2 porażki = DOWN (~4 s), 2 sukcesy = UP
    default-server inter 2s fall 2 rise 2
    server onprem 10.10.20.6:80   check
    server azure  10.50.1.250:80  check backup   # używany tylko, gdy onprem jest DOWN

frontend stats
    bind 10.10.20.1:8404
    stats enable
    stats uri /
    stats refresh 5s
