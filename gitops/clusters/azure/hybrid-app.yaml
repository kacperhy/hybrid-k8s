apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/kacperhy/hybrid-k8s.git
    targetRevision: main
    path: deploy/overlays/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: hybrid-app
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
