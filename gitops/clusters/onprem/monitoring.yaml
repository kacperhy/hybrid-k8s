apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "75.*"   # zaktualizuj: helm search repo prometheus-community/kube-prometheus-stack
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/monitoring/values-common.yaml
          - $values/platform/monitoring/values-onprem.yaml
    - repoURL: https://github.com/kacperhy/hybrid-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRD prometheus-operatora są za duże dla client-side apply
